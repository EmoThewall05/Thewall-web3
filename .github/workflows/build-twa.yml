name: TWA Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get install -y expect
          sudo apt-get install -y android-sdk || true

      - name: Decode keystore
        run: echo "${{ secrets.TWA_KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Build TWA APK
        run: |
          expect << 'EXPECT'
          set timeout 180
          spawn bubblewrap build --manifest twa-manifest.json --skipPwaValidation
          expect "JDK" { send "No\r" }
          expect "Path to your existing JDK" { send "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.18-8/x64\r" }
          expect "Android SDK" { send "No\r" }
          expect "Path to your existing Android SDK" { send "/usr/lib/android-sdk\r" }
          expect eof
          EXPECT
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        timeout-minutes: 20

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheWall-Release-APK
          path: |
            ./*.apk
            ./app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
