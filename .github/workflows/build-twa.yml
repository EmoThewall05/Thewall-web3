name: TWA Build (TheWall)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # 1. നേരിട്ട് ഒരു twa-manifest.json ഉണ്ടാക്കുന്നു (ഇതാണ് ബുദ്ധി)
          bubblewrap init --manifest="https://thewall.e-mobies.com/manifest.json" --directory="./" --confirm

          # 2. Keystore ഉണ്ടാക്കുന്നു (നിന്റെ പേരും വിവരങ്ങളും)
          keytool -genkey -v -keystore android.keystore -alias thewall -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Divin, OU=Dwin, O=Dwin, L=Dubai, S=Dubai, C=AE"

          # 3. Build അടിക്കുന്നു
          bubblewrap build --signingKeyPath="android.keystore" --signingKeyAlias="thewall" --signingKeyPassword="$KEYSTORE_PASSWORD" --signingKeyStorePassword="$KEYSTORE_PASSWORD"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thewall-release
          path: app-release-signed.apk
