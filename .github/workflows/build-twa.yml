name: TWA Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA
        run: bubblewrap init --manifest https://thewall.e-mobies.com/manifest.json --directory twa-project
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: true

      - name: Build TWA APK
        run: |
          cd twa-project
          bubblewrap build --skipPwaValidation
        timeout-minutes: 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheWall-Release-APK
          path: twa-project/*.apk
