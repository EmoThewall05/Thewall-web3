name: TWA Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK
        run: |
          echo "Starting TWA Build Process..."
          # ഇവിടെയാണ് നമ്മൾ 'yes' കമാൻഡ് ഉപയോഗിക്കുന്നത്
          yes | bubblewrap build
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheWall-Release-APK
          path: ./*.apk
