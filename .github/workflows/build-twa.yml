name: TWA Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA non-interactive
        run: |
          echo '{"jdkPath":"","androidSdkPath":""}' > ~/.bubblewrap/config.json || true
          printf 'No\n' | bubblewrap init \
            --manifest https://thewall.e-mobies.com/manifest.json \
            --directory twa-project || true
          ls -la

      - name: Build TWA APK
        run: |
          ls -la
          if [ -d "twa-project" ]; then
            cd twa-project && bubblewrap build --skipPwaValidation
          else
            echo "twa-project not created, init failed"
            exit 1
          fi
        timeout-minutes: 20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheWall-Release-APK
          path: twa-project/*.apk
