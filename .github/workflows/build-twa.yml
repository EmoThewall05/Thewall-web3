name: TWA Build (TheWall)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # 1. ചോദ്യങ്ങൾ ഒഴിവാക്കാൻ കോൺഫിഗറേഷൻ സെറ്റ് ചെയ്യുന്നു
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"/usr/local/lib/android/sdk\"}" > ~/.bubblewrap/config.json

          # 2. PWA Manifest-ൽ നിന്ന് പ്രോജക്റ്റ് സെറ്റ് ചെയ്യുന്നു
          bubblewrap init --manifest="https://thewall.e-mobies.com/manifest.json" --directory="./" --confirm

          # 3. പുതിയ കീസ്റ്റോർ ഉണ്ടാക്കുന്നു
          keytool -genkey -v -keystore android.keystore -alias thewall -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Divin, OU=Dwin, O=Dwin, L=Dubai, S=Dubai, C=AE"

          # 4. ബിൽഡ് സ്റ്റാർട്ട് ചെയ്യുന്നു
          bubblewrap build --signingKeyPath="android.keystore" --signingKeyAlias="thewall" --signingKeyPassword="$KEYSTORE_PASSWORD" --signingKeyStorePassword="$KEYSTORE_PASSWORD" --skipCheck

      - name: Upload Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: thewall-build-files
          path: |
            app-release-signed.apk
            app-release-signed.aab
